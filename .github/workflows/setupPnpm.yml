name: Setup PNPM
on: 
    workflow_call:
        inputs:
            install-deps:
                required: false
                default: true
                type: boolean
jobs:
    setupPnpm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: latest
            - uses: pnpm/action-setup@v4
              with:
                version: latest
            - run: pnpm install --frozen-lockfile
              if: ${{inputs.install-deps}}
