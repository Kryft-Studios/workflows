name: Docs with Typedoc
on:
    workflow_call:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    buildDocs:
        runs-on: ubuntu-latest
        steps:
            - uses: ./.github/workflows/setupPnpm.yml
              with:
                install-deps: true
            - run: pnpm exec typedoc
            
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                path: ./docs
    deploy: 
        environment: 
            name: "github-pages"
            url: ${{ steps.deployment.outputs.page_url }} 
        runs-on: ubuntu-latest 
        needs: buildDocs
        steps: 
            - name: Deploy to GitHub Pages 
              id: deployment 
              uses: actions/deploy-pages@v4
            